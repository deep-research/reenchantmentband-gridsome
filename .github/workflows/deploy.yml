\name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Prepare docker-compose for Linux runner
        run: |
          if [ -f docker-compose.yml ]; then
            sed -i '/C:\\Users/d' docker-compose.yml
          elif [ -f docker-compose.yaml ]; then
            sed -i '/C:\\Users/d' docker-compose.yaml
          fi

      - name: Build via Docker Compose
        run: |
          docker compose run --rm frontend yarn install
          docker compose run --rm frontend yarn build

      - name: Fix dist folder permissions
        run: sudo chown -R $USER:$USER dist

      - name: Copy build files to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/reenchantment/"

      - name: Flatten directory structure on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cp -a /var/www/reenchantment/dist/. /var/www/reenchantment/
            rm -rf /var/www/reenchantment/dist